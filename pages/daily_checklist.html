<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Ritual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; }
        .checkbox-custom { width: 24px; height: 24px; accent-color: #4ade80; }
        progress::-webkit-progress-value { background-color: #4ade80; transition: width 0.3s ease; }
        progress::-webkit-progress-bar { background-color: #333; border-radius: 10px; }
        progress { border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body class="p-6 max-w-md mx-auto">

    <h1 class="text-2xl font-bold mb-2">Daily Tasks</h1>
    <p id="current-date" class="text-gray-400 mb-6"></p>

    <div class="mb-8">
        <div class="flex justify-between mb-2">
            <span>Progress</span>
            <span id="progress-text">0%</span>
        </div>
        <progress id="progress-bar" class="w-full h-4" value="0" max="100"></progress>
    </div>

    <div id="task-container" class="space-y-4 mb-10">
        </div>

    <h2 class="text-xl font-bold mb-4 border-t border-gray-700 pt-6">History</h2>
    <div id="history-container" class="space-y-2 text-sm text-gray-400">
        </div>

    <script>
        // EDIT YOUR TASKS HERE
        const TASKS = ["Drink 2L Water", "Exercise 30m", "Read 10 Pages", "Meditation"];

        const taskContainer = document.getElementById('task-container');
        const historyContainer = document.getElementById('history-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const dateEl = document.getElementById('current-date');

        const today = new Date().toLocaleDateString();
        dateEl.innerText = today;

        // Load data
        let state = JSON.parse(localStorage.getItem('dailyAppState')) || { date: today, completed: [], history: [] };

        // Check for Daily Reset
        if (state.date !== today) {
            const score = Math.round((state.completed.length / TASKS.length) * 100);
            state.history.unshift({ date: state.date, score: score });
            state.history = state.history.slice(0, 7); // Keep last 7 days
            state.date = today;
            state.completed = [];
            save();
        }

        function save() {
            localStorage.setItem('dailyAppState', JSON.stringify(state));
            render();
        }

        function toggleTask(task) {
            if (state.completed.includes(task)) {
                state.completed = state.completed.filter(t => t !== task);
            } else {
                state.completed.push(task);
            }
            save();
        }

        function render() {
            // Render Tasks
            taskContainer.innerHTML = TASKS.map(task => `
                <div class="flex items-center gap-4 bg-gray-800 p-4 rounded-lg">
                    <input type="checkbox" class="checkbox-custom" 
                        ${state.completed.includes(task) ? 'checked' : ''} 
                        onclick="toggleTask('${task}')">
                    <span class="${state.completed.includes(task) ? 'line-through text-gray-500' : ''}">${task}</span>
                </div>
            `).join('');

            // Update Progress
            const pct = Math.round((state.completed.length / TASKS.length) * 100) || 0;
            progressBar.value = pct;
            progressText.innerText = `${pct}%`;

            // Render History
            historyContainer.innerHTML = state.history.map(h => `
                <div class="flex justify-between border-b border-gray-800 pb-1">
                    <span>${h.date}</span>
                    <span class="font-mono">${h.score}%</span>
                </div>
            `).join('');
        }

        render();
    </script>
</body>
</html>
